<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">03-requisitos-funcionales-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M468 530 L608 530" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="484.7" y="489" width="106.60000000000001" height="37" rx="8" fill="#faf8f1"/><text x="538" y="512" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">Validar</text><path d="M1008 530 L1148 530" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="1024.7" y="489" width="106.60000000000001" height="37" rx="8" fill="#faf8f1"/><text x="1078" y="512" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">Revisar</text><path d="M1540 455 L1580 455 L1580 410 L1608 410" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1540 615 L1580 615 L1580 730 L1608 730" fill="none" stroke="#b23c35" stroke-width="3" stroke-linejoin="round"  marker-end="url(#red)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · REQUISITOS FUNCIONALES</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">De una fotografía enviada a una publicación</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Flujo representativo: recepción, autorización, revisión y resultado visible.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">RF10 y RF14: el propietario solicita la retirada; el personal decide. No existe eliminación pública automática.</text><g id="card-1" data-card="80,355,380,350"><rect x="80" y="355" width="380" height="350" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="355" width="380" height="7" rx="3" fill="#166534"/><text x="108" y="398" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">RF09 · RECEPCIÓN</text><text x="108" y="443" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Recibir fotografía</text><path d="M108 471H432" stroke="#e4e8df"/><text x="108" y="506" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sesión válida</text><text x="108" y="539" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">WebP procesado</text><text x="108" y="572" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Reserva de cuota</text><rect x="108" y="647" width="324" height="36" rx="11" fill="#edf5eb"/><text x="270" y="672" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Estado: pending</text></g><g id="card-2" data-card="620,355,380,350"><rect x="620" y="355" width="380" height="350" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="620" y="355" width="380" height="7" rx="3" fill="#2563eb"/><text x="648" y="398" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">RF11 · SEGURIDAD</text><text x="648" y="443" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Comprobar al</text><text x="648" y="479" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">personal</text><path d="M648 507H972" stroke="#e4e8df"/><text x="648" y="542" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Verificar token</text><text x="648" y="575" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comprobar membresía</text><text x="648" y="608" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Autorizar la acción</text><rect x="648" y="647" width="324" height="36" rx="11" fill="#edf3fd"/><text x="810" y="672" font-size="19" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="0">Solo personal autorizado</text></g><g id="card-3" data-card="1160,355,380,350"><rect x="1160" y="355" width="380" height="350" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1160" y="355" width="380" height="7" rx="3" fill="#2563eb"/><text x="1188" y="398" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">RF13 · MODERACIÓN</text><text x="1188" y="443" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Aprobar o rechazar</text><path d="M1188 471H1512" stroke="#e4e8df"/><text x="1188" y="506" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comprobar estado</text><text x="1188" y="539" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Guardar revisor</text><text x="1188" y="572" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Registrar la fecha</text><rect x="1188" y="647" width="324" height="36" rx="11" fill="#edf3fd"/><text x="1350" y="672" font-size="19" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="0">Decisión controlada</text></g><g id="card-4" data-card="1620,300,220,225"><rect x="1620" y="300" width="220" height="225" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1620" y="300" width="220" height="7" rx="3" fill="#166534"/><text x="1648" y="335" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">RF08</text><text x="1648" y="376" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Publicada</text><path d="M1648 385H1812" stroke="#e4e8df"/><text x="1648" y="420" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Visible en el</text><text x="1648" y="449" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">muro.</text></g><g id="card-5" data-card="1620,620,220,225"><rect x="1620" y="620" width="220" height="225" rx="24" fill="white" stroke="#e9c4be" stroke-width="2"/><rect x="1620" y="620" width="220" height="7" rx="3" fill="#b23c35"/><text x="1648" y="655" font-size="16" font-weight="700" fill="#b23c35" text-anchor="start" letter-spacing="1">RESULTADO</text><text x="1648" y="696" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Rechazada</text><path d="M1648 705H1812" stroke="#e4e8df"/><text x="1648" y="740" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fuera del</text><text x="1648" y="769" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">muro.</text></g><rect x="80" y="845" width="1460" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="881" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">La subida no equivale a publicación</text><text x="108" y="914" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El muro público consulta únicamente fotografías aprobadas con estado published.</text></svg>