89H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">deletion_requested es una marca paralela: solicitar la retirada no cambia por sí solo la publicación.</text><g id="card-1" data-card="80,300,360,230"><rect x="80" y="300" width="360" height="230" rx="24" fill="white" stroke="#d6ddd3" stroke-width="2"/><rect x="80" y="300" width="360" height="7" rx="3" fill="#536459"/><text x="108" y="335" font-size="16" font-weight="700" fill="#536459" text-anchor="start" letter-spacing="1">RESERVA</text><text x="108" y="376" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">uploading</text><path d="M108 385H412" stroke="#e4e8df"/><text x="108" y="420" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Archivo aún no confirmado.</text></g><g id="card-2" data-card="600,300,360,230"><rect x="600" y="300" width="360" height="230" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="600" y="300" width="360" height="7" rx="3" fill="#2563eb"/><text x="628" y="335" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1">RECEPCIÓN</text><text x="628" y="376" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">pending</text><path d="M628 385H932" stroke="#e4e8df"/><text x="628" y="420" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Lista para revisión.</text></g><g id="card-3" data-card="1130,270,360,230"><rect x="1130" y="270" width="360" height="230" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1130" y="270" width="360" height="7" rx="3" fill="#166534"/><text x="1158" y="305" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">APROBACIÓN</text><text x="1158" y="346" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">published</text><path d="M1158 355H1462" stroke="#e4e8df"/><text x="1158" y="390" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Visible en el muro.</text></g><g id="card-4" data-card="1130,590,360,230"><rect x="1130" y="590" width="360" height="230" rx="24" fill="white" stroke="#e9c4be" stroke-width="2"/><rect x="1130" y="590" width="360" height="7" rx="3" fill="#b23c35"/><text x="1158" y="625" font-size="16" font-weight="700" fill="#b23c35" text-anchor="start" letter-spacing="1">RECHAZO</text><text x="1158" y="666" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">rejected</text><path d="M1158 675H1462" stroke="#e4e8df"/><text x="1158" y="710" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fuera del muro.</text></g><g id="card-5" data-card="80,730,360,230"><rect x="80" y="730" width="360" height="230" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="80" y="730" width="360" height="7" rx="3" fill="#b45309"/><text x="108" y="765" font-size="16" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1">RECUPERACIÓN</text><text x="108" y="806" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">deleting</text><path d="M108 815H412" stroke="#e4e8df"/><text x="108" y="850" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Retirar objeto y fila.</text></g><g id="card-6" data-card="1650,450,190,230"><rect x="1650" y="450" width="190" height="230" rx="24" fill="white" stroke="#d6ddd3" stroke-width="2"/><rect x="1650" y="450" width="190" height="7" rx="3" fill="#536459"/><text x="1678" y="485" font-size="16" font-weight="700" fill="#536459" text-anchor="start" letter-spacing="1">FINAL</text><text x="1678" y="526" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Eliminada</text><path d="M1678 535H1812" stroke="#e4e8df"/><text x="1678" 