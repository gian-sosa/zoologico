<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">07-decisiones-arquitectonicas-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M474 535 L526 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M932 535 L984 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1390 535 L1442 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1647 735 L1647 788 L273 788 L273 735" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#amber)"/><rect x="741.5" y="760" width="437" height="37" rx="8" fill="#faf8f1"/><text x="960" y="783" font-size="21" font-weight="600" fill="#b45309" text-anchor="middle">Nueva necesidad → revisar el driver</text><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · DECISIONES</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Las decisiones evolucionan con evidencia</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Un ADR registra contexto, alternativas, decisión y consecuencias.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Los ADR documentan decisiones observables. No representan SLA ni aprobaciones institucionales.</text><g id="card-1" data-card="80,345,386,390"><rect x="80" y="345" width="386" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="345" width="386" height="7" rx="3" fill="#166534"/><text x="108" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">ENTRADA</text><text x="108" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Driver y riesgo</text><path d="M108 461H438" stroke="#e4e8df"/><text x="108" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Identificar el problema</text><text x="108" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Priorizar su impacto</text><text x="108" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Definir restricciones</text></g><g id="card-2" data-card="538,345,386,390"><rect x="538" y="345" width="386" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="538" y="345" width="386" height="7" rx="3" fill="#2563eb"/><text x="566" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">JUSTIFICACIÓN</text><text x="566" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Registro ADR</text><path d="M566 461H896" stroke="#e4e8df"/><text x="566" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comparar alternativas</text><text x="566" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Elegir una solución</text><text x="566" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Explicar sus costes</text></g><g id="card-3" data-card="996,345,386,390"><rect x="996" y="345" width="386" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="996" y="345" width="386" height="7" rx="3" fill="#2563eb"/><text x="1024" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">APLICACIÓN</text><text x="1024" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Implementación</text><path d="M1024 461H1354" stroke="#e4e8df"/><text x="1024" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Código del sistema</text><text x="1024" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Políticas y permisos</text><text x="1024" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Configuración</text></g><g id="card-4" data-card="1454,345,386,390"><rect x="1454" y="345" width="386" height="390" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1454" y="345" width="386" height="7" rx="3" fill="#b45309"/><text x="1482" y="388" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">EVALUACIÓN</text><text x="1482" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Pruebas y medidas</text><path d="M1482 461H1812" stroke="#e4e8df"/><text x="1482" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comprobar escenarios</text><text x="1482" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Registrar resultados</text><text x="1482" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Detectar nuevos límites</text></g><rect x="80" y="835" width="1760" height="100" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="871" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Ocho decisiones observadas en el repositorio</text><text x="108" y="904" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cliente-servidor · modularidad · BaaS · permisos · contenido público · archivos · idempotencia · operación.</text></svg>