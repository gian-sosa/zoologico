<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">nivel1-contexto</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M520 450 L610 450 L610 555 L698 555" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M520 810 L610 810 L610 655 L698 655" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1210 545 L1310 545 L1310 370 L1388 370" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1210 680 L1310 680 L1310 870 L1388 870" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><path d="M1620 460 L1620 518" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="1668.5" y="477" width="83" height="37" rx="8" fill="#faf8f1"/><text x="1710" y="500" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">OAuth</text><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · C4 · NIVEL 1 · CONTEXTO</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">La Totorilla en su entorno</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Una sola caja para el sistema: quién lo usa y con qué proveedores se relaciona.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las flechas indican uso. Google autentica cuentas; la membresía del personal se comprueba de forma independiente.</text><g id="card-1" data-card="80,330,440,240"><rect x="80" y="330" width="440" height="240" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="330" width="440" height="7" rx="3" fill="#166534"/><text x="108" y="365" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">PERSONA</text><text x="108" y="406" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Público y consumidores</text><path d="M108 415H492" stroke="#e4e8df"/><text x="108" y="450" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Consulta, aprende, participa</text><text x="108" y="479" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">y presenta documentos o reclamos.</text></g><g id="card-2" data-card="80,690,440,240"><rect x="80" y="690" width="440" height="240" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="80" y="690" width="440" height="7" rx="3" fill="#2563eb"/><text x="108" y="725" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1">PERSONA</text><text x="108" y="766" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Personal autorizado</text><path d="M108 775H492" stroke="#e4e8df"/><text x="108" y="810" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Gestiona tarifas y revisa</text><text x="108" y="839" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">registros privados.</text></g><g id="card-3" data-card="710,440,500,330"><rect x="710" y="440" width="500" height="330" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="710" y="440" width="500" height="7" rx="3" fill="#166534"/><text x="738" y="483" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">SISTEMA PROPIO</text><text x="738" y="528" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Plataforma La Totorilla</text><path d="M738 556H1182" stroke="#e4e8df"/><text x="738" y="591" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Información y educación</text><text x="738" y="624" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fotografías moderadas</text><text x="738" y="657" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Documentos y reclamaciones</text><rect x="738" y="712" width="444" height="36" rx="11" fill="#edf5eb"/><text x="960" y="737" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Aplicación web</text></g><g id="card-4" data-card="1400,280,440,180"><rect x="1400" y="280" width="440" height="180" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1400" y="280" width="440" height="7" rx="3" fill="#166534"/><text x="1428" y="315" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">SISTEMA EXTERNO</text><text x="1428" y="356" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Supabase</text><path d="M1428 365H1812" stroke="#e4e8df"/><text x="1428" y="400" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Identidad, datos y archivos.</text></g><g id="card-5" data-card="1400,530,440,180"><rect x="1400" y="530" width="440" height="180" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1400" y="530" width="440" height="7" rx="3" fill="#2563eb"/><text x="1428" y="565" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1">IDENTIDAD EXTERNA</text><text x="1428" y="606" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Google</text><path d="M1428 615H1812" stroke="#e4e8df"/><text x="1428" y="650" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Login institucional vía Auth.</text></g><g id="card-6" data-card="1400,780,440,180"><rect x="1400" y="780" width="440" height="180" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1400" y="780" width="440" height="7" rx="3" fill="#b45309"/><text x="1428" y="815" font-size="16" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1">CORREO EXTERNO</text><text x="1428" y="856" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Resend</text><path d="M1428 865H1812" stroke="#e4e8df"/><text x="1428" y="900" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Copia de las hojas registradas.</text></g></svg>