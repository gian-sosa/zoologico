<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1268" viewBox="0 0 1920 1268" role="img" aria-labelledby="title"><title id="title">patrones-de-diseno-2</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1268" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M300 370V1148" stroke="#bed3c0" stroke-width="2" stroke-dasharray="7 8"/><path d="M740 370V1148" stroke="#c3d3ee" stroke-width="2" stroke-dasharray="7 8"/><path d="M1180 370V1148" stroke="#bed3c0" stroke-width="2" stroke-dasharray="7 8"/><path d="M1620 370V1148" stroke="#bed3c0" stroke-width="2" stroke-dasharray="7 8"/><path d="M740 480 L305 480" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M300 576 L735 576" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M740 642 L800 642 L800 686 L744 686" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M740 768 L1175 768" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1180 864 L745 864" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M740 960 L1615 960" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M740 1056 L305 1056" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · DISEÑO · SUSCRIPCIÓN DE AUTH</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">La sesión cambia; la interfaz se actualiza</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">AuthProvider escucha eventos, comprueba membresía y publica el estado a sus consumidores.</text><path d="M80 1177H1840" stroke="#dce3d8"/><text x="80" y="1215" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El contexto controla la UI. Las API y RLS vuelven a comprobar los permisos en la operación real.</text><rect x="92" y="265" width="416" height="104" rx="18" fill="#edf5eb" stroke="#bed3c0"/><text x="300" y="298" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">PROVEEDOR</text><text x="300" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">Supabase Auth</text><rect x="532" y="265" width="416" height="104" rx="18" fill="#edf3fd" stroke="#c3d3ee"/><text x="740" y="298" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">CONTEXTO</text><text x="740" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">AuthProvider</text><rect x="972" y="265" width="416" height="104" rx="18" fill="#edf5eb" stroke="#bed3c0"/><text x="1180" y="298" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">DATOS</text><text x="1180" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">photo_admins</text><rect x="1412" y="265" width="416" height="104" rx="18" fill="#edf5eb" stroke="#bed3c0"/><text x="1620" y="298" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">INTERFAZ</text><text x="1620" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">useAuth</text><circle cx="47" cy="472" r="17" fill="#edf3fd"/><text x="47" y="478" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">1</text><rect x="352.4" y="444" width="335.2" height="32" rx="7" fill="#faf8f1"/><text x="520" y="462" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Suscribir onAuthStateChange</text><circle cx="47" cy="568" r="17" fill="#edf5eb"/><text x="47" y="574" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">2</text><rect x="358.20000000000005" y="540" width="323.59999999999997" height="32" rx="7" fill="#faf8f1"/><text x="520" y="558" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Notificar cambio de sesión</text><circle cx="47" cy="664" r="17" fill="#edf3fd"/><text x="47" y="670" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">3</text><text x="820" y="657" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Diferir consulta fuera del callback de Auth</text><circle cx="47" cy="760" r="17" fill="#edf3fd"/><text x="47" y="766" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">4</text><rect x="798.2" y="706" width="323.59999999999997" height="58" rx="7" fill="#faf8f1"/><text x="960" y="724" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Consultar membresía cuando</text><text x="960" y="750" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">corresponde</text><circle cx="47" cy="856" r="17" fill="#edf5eb"/><text x="47" y="862" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">5</text><rect x="804" y="828" width="312" height="32" rx="7" fill="#faf8f1"/><text x="960" y="846" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Resultado de autorización</text><circle cx="47" cy="952" r="17" fill="#edf3fd"/><text x="47" y="958" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">6</text><rect x="954.4" y="924" width="451.2" height="32" rx="7" fill="#faf8f1"/><text x="1180" y="942" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Publicar el nuevo estado del contexto</text><circle cx="47" cy="1048" r="17" fill="#edf3fd"/><text x="47" y="1054" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">7</text><rect x="311.8" y="1020" width="416.4" height="32" rx="7" fill="#faf8f1"/><text x="520" y="1038" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Al desmontar: cancelar suscripción</text><rect x="80" y="1112" width="1760" height="60" rx="20" fill="#fff4e1" stroke="#ecd4ad"/><text x="108" y="1150" font-size="24" font-weight="600" fill="#b45309" text-anchor="start" letter-spacing="0">Evitar que una respuesta de sesión antigua sobrescriba el estado más reciente.</text></svg>