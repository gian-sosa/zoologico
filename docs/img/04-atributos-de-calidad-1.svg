<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">04-atributos-de-calidad-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M240 370 L240 428" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M600 370 L600 428" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M960 370 L960 428" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1320 370 L1320 428" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1680 370 L1680 428" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · CALIDAD</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Mecanismos que sostienen la calidad</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Los atributos se defienden con evidencia, pruebas y condiciones de medición.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Los mecanismos de diseño no equivalen a un SLA, seguridad absoluta ni certificación de accesibilidad.</text><rect x="80" y="270" width="1760" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="306" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Calidad observable en La Totorilla</text><text x="108" y="339" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Seguridad e integridad protegen la información; rendimiento y accesibilidad facilitan la visita.</text><g id="card-1" data-card="80,440,320,370"><rect x="80" y="440" width="320" height="370" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="440" width="320" height="7" rx="3" fill="#166534"/><text x="108" y="483" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">SEGURIDAD</text><text x="108" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Identidad y</text><text x="108" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">permisos</text><path d="M108 592H372" stroke="#e4e8df"/><text x="108" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Token verificado</text><text x="108" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Membresía explícita</text><text x="108" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Políticas RLS</text></g><g id="card-2" data-card="440,440,320,370"><rect x="440" y="440" width="320" height="370" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="440" y="440" width="320" height="7" rx="3" fill="#2563eb"/><text x="468" y="483" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">INTEGRIDAD</text><text x="468" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Datos</text><text x="468" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">consistentes</text><path d="M468 592H732" stroke="#e4e8df"/><text x="468" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Claves únicas</text><text x="468" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cuotas atómicas</text><text x="468" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Estados controlados</text></g><g id="card-3" data-card="800,440,320,370"><rect x="800" y="440" width="320" height="370" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="800" y="440" width="320" height="7" rx="3" fill="#166534"/><text x="828" y="483" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">RENDIMIENTO</text><text x="828" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Recursos</text><text x="828" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">eficientes</text><path d="M828 592H1092" stroke="#e4e8df"/><text x="828" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">CDN y rutas lazy</text><text x="828" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Imágenes WebP</text><text x="828" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Datos estáticos</text></g><g id="card-4" data-card="1160,440,320,370"><rect x="1160" y="440" width="320" height="370" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1160" y="440" width="320" height="7" rx="3" fill="#2563eb"/><text x="1188" y="483" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">ACCESIBILIDAD</text><text x="1188" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Uso inclusivo</text><path d="M1188 556H1452" stroke="#e4e8df"/><text x="1188" y="591" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Teclado y foco</text><text x="1188" y="624" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Formularios claros</text><text x="1188" y="657" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Movimiento reducido</text></g><g id="card-5" data-card="1520,440,320,370"><rect x="1520" y="440" width="320" height="370" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1520" y="440" width="320" height="7" rx="3" fill="#b45309"/><text x="1548" y="483" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">MANTENIMIENTO</text><text x="1548" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Cambios</text><text x="1548" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">verificables</text><path d="M1548 592H1812" stroke="#e4e8df"/><text x="1548" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Módulos cohesionados</text><text x="1548" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Pruebas Node y SQL</text><text x="1548" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Scripts operativos</text></g><rect x="80" y="865" width="1760" height="92" rx="20" fill="#f1f3ee" stroke="#d6ddd3"/><text x="108" y="901" font-size="24" font-weight="600" fill="#536459" text-anchor="start" letter-spacing="0">Verificar → medir → registrar evidencia</text><text x="108" y="934" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Disponibilidad, escalabilidad y operación se evalúan con los escenarios de calidad.</text></svg>