<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">diseno-interno-de-modulos-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M472 460 L528 460" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M932 460 L988 460" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1392 460 L1448 460" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M730 605 L730 670 L330 670 L330 720" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1650 605 L1650 660 L960 660 L960 720" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1650 605 L1650 720" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · DISEÑO · COMUNIDAD</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Una fotografía cruza responsabilidades distintas</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Del evento de interfaz a una operación validada y almacenada de forma privada.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La lectura del muro usa Data API y URL firmadas con RLS. El envío y la moderación utilizan /api/photos.</text><g id="card-1" data-card="80,320,380,285"><rect x="80" y="320" width="380" height="285" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="320" width="380" height="7" rx="3" fill="#166534"/><text x="108" y="363" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">INTERFAZ</text><text x="108" y="408" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Página y PhotoWall</text><path d="M108 436H432" stroke="#e4e8df"/><text x="108" y="471" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Selección de imágenes</text><text x="108" y="504" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Interacción y mensajes</text></g><g id="card-2" data-card="540,320,380,285"><rect x="540" y="320" width="380" height="285" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="540" y="320" width="380" height="7" rx="3" fill="#166534"/><text x="568" y="363" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">ESTADO</text><text x="568" y="408" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">useVisitorPhotos</text><path d="M568 436H892" stroke="#e4e8df"/><text x="568" y="471" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Carga y paginación</text><text x="568" y="504" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Coordina cada operación</text></g><g id="card-3" data-card="1000,320,380,285"><rect x="1000" y="320" width="380" height="285" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1000" y="320" width="380" height="7" rx="3" fill="#166534"/><text x="1028" y="363" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">ACCESO</text><text x="1028" y="408" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">photos.store</text><path d="M1028 436H1352" stroke="#e4e8df"/><text x="1028" y="471" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sesión y token</text><text x="1028" y="504" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">listPhotos / photoRequest</text></g><g id="card-4" data-card="1460,320,380,285"><rect x="1460" y="320" width="380" height="285" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1460" y="320" width="380" height="7" rx="3" fill="#2563eb"/><text x="1488" y="363" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">SERVIDOR</text><text x="1488" y="408" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">api/photos</text><path d="M1488 436H1812" stroke="#e4e8df"/><text x="1488" y="471" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Permisos y propietario</text><text x="1488" y="504" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Reserva y confirmación</text></g><rect x="80" y="730" width="500" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="766" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Compresión del navegador</text><text x="108" y="799" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">fileToCompressedWebP: original → WebP.</text><rect x="710" y="730" width="500" height="92" rx="20" fill="#edf3fd" stroke="#c3d3ee"/><text x="738" y="766" font-size="24" font-weight="600" fill="#2563eb" text-anchor="start" letter-spacing="0">Procesamiento confiable</text><text x="738" y="799" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">sanitizeWebp: recodifica con Sharp.</text><rect x="1340" y="730" width="500" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="1368" y="766" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Supabase</text><text x="1368" y="799" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Auth, cuota SQL y Storage privado.</text><rect x="80" y="865" width="1760" height="92" rx="20" fill="#f1f3ee" stroke="#d6ddd3"/><text x="108" y="901" font-size="24" font-weight="600" fill="#536459" text-anchor="start" letter-spacing="0">Publicación diferida</text><text x="108" y="934" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La API confirma pending. Solo la aprobación posterior del personal hace que aparezca en el muro.</text></svg>