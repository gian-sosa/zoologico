<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">01-actores-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M520 380 L610 380 L610 595 L690 595" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M520 610 L610 610 L610 595 L690 595" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M520 840 L610 840 L610 595 L690 595" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1220 595 L1310 595 L1310 380 L1390 380" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1220 595 L1310 595 L1310 610 L1390 610" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1220 595 L1310 595 L1310 840 L1390 840" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · ACTORES</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Personas, plataforma y servicios</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cada actor persigue un objetivo; los proveedores aportan capacidades técnicas.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El personal técnico configura proveedores y permisos. Una misma persona puede desempeñar varios roles.</text><g id="card-1" data-card="80,275,440,210"><rect x="80" y="275" width="440" height="210" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="275" width="440" height="7" rx="3" fill="#166534"/><text x="108" y="310" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">PÚBLICO</text><text x="108" y="351" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Visitante y remitente</text><path d="M108 360H492" stroke="#e4e8df"/><text x="108" y="395" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Consulta, aprende y presenta</text><text x="108" y="424" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">documentos.</text></g><g id="card-2" data-card="80,505,440,210"><rect x="80" y="505" width="440" height="210" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="80" y="505" width="440" height="7" rx="3" fill="#2563eb"/><text x="108" y="540" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1">PERSONAL</text><text x="108" y="581" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Administrador</text><path d="M108 590H492" stroke="#e4e8df"/><text x="108" y="625" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Gestiona tarifas y revisa</text><text x="108" y="654" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">contenido privado.</text></g><g id="card-3" data-card="80,735,440,210"><rect x="80" y="735" width="440" height="210" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="735" width="440" height="7" rx="3" fill="#166534"/><text x="108" y="770" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">OPERACIÓN</text><text x="108" y="811" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Responsable técnico</text><path d="M108 820H492" stroke="#e4e8df"/><text x="108" y="855" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Configura servicios y ejecuta</text><text x="108" y="884" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">mantenimiento.</text></g><g id="card-4" data-card="700,455,520,280"><rect x="700" y="455" width="520" height="280" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="700" y="455" width="520" height="7" rx="3" fill="#2563eb"/><text x="728" y="498" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">SISTEMA PROPIO</text><text x="728" y="543" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Plataforma La Totorilla</text><path d="M728 571H1192" stroke="#e4e8df"/><text x="728" y="606" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Información, educación, Comunidad,</text><text x="728" y="639" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Mesa de Partes y reclamaciones.</text></g><g id="card-5" data-card="1400,275,440,210"><rect x="1400" y="275" width="440" height="210" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1400" y="275" width="440" height="7" rx="3" fill="#166534"/><text x="1428" y="310" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">IDENTIDAD</text><text x="1428" y="351" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Supabase Auth</text><path d="M1428 360H1812" stroke="#e4e8df"/><text x="1428" y="395" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sesiones anónimas y Google</text><text x="1428" y="424" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">institucional.</text></g><g id="card-6" data-card="1400,505,440,210"><rect x="1400" y="505" width="440" height="210" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1400" y="505" width="440" height="7" rx="3" fill="#166534"/><text x="1428" y="540" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">PERSISTENCIA</text><text x="1428" y="581" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Datos y archivos</text><path d="M1428 590H1812" stroke="#e4e8df"/><text x="1428" y="625" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">PostgreSQL con RLS y Storage</text><text x="1428" y="654" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">privado.</text></g><g id="card-7" data-card="1400,735,440,210"><rect x="1400" y="735" width="440" height="210" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1400" y="735" width="440" height="7" rx="3" fill="#b45309"/><text x="1428" y="770" font-size="16" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1">COMUNICACIÓN</text><text x="1428" y="811" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Resend</text><path d="M1428 820H1812" stroke="#e4e8df"/><text x="1428" y="855" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Copia por correo de las</text><text x="1428" y="884" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">reclamaciones.</text></g></svg>