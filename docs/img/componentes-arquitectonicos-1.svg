<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">componentes-arquitectonicos-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M474 535 L526 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M932 535 L984 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1390 535 L1442 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ARQUITECTURA · COMPONENTES</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Responsabilidades que colaboran</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las páginas presentan; los servicios coordinan; las API ejecutan operaciones sensibles.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La agrupación representa responsabilidades, no procesos independientes ni una API para cada carpeta.</text><g id="card-1" data-card="80,345,386,390"><rect x="80" y="345" width="386" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="345" width="386" height="7" rx="3" fill="#166534"/><text x="108" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">PRESENTACIÓN</text><text x="108" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Páginas y</text><text x="108" y="469" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">componentes</text><path d="M108 497H438" stroke="#e4e8df"/><text x="108" y="532" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Interacción del usuario</text><text x="108" y="565" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Formularios y mensajes</text><text x="108" y="598" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Mapa y contenido</text></g><g id="card-2" data-card="538,345,386,390"><rect x="538" y="345" width="386" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="538" y="345" width="386" height="7" rx="3" fill="#166534"/><text x="566" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">COORDINACIÓN</text><text x="566" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Hooks y servicios</text><path d="M566 461H896" stroke="#e4e8df"/><text x="566" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Estado de cada función</text><text x="566" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Consultas con SDK</text><text x="566" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Peticiones HTTP</text></g><g id="card-3" data-card="996,345,386,390"><rect x="996" y="345" width="386" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="996" y="345" width="386" height="7" rx="3" fill="#2563eb"/><text x="1024" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">SERVIDOR PROPIO</text><text x="1024" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">API y helpers</text><path d="M1024 461H1354" stroke="#e4e8df"/><text x="1024" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fotos, documentos y hojas</text><text x="1024" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Validación y Sharp</text><text x="1024" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Copia por correo</text></g><g id="card-4" data-card="1454,345,386,390"><rect x="1454" y="345" width="386" height="390" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1454" y="345" width="386" height="7" rx="3" fill="#b45309"/><text x="1482" y="388" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">PROVEEDORES</text><text x="1482" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Supabase y Resend</text><path d="M1482 461H1812" stroke="#e4e8df"/><text x="1482" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Identidad y persistencia</text><text x="1482" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Archivos privados</text><text x="1482" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Aceptación de correo</text></g><rect x="80" y="835" width="1760" height="100" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="871" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Consultas directas autorizadas</text><text x="108" y="904" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Los servicios también consultan Supabase con RLS y leen datos educativos estáticos sin pasar por una API propia.</text></svg>