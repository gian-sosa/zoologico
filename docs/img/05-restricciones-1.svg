<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">05-restricciones-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M568 535 L708 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1208 535 L1348 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · RESTRICCIONES</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Fronteras de configuración y confianza</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El navegador recibe configuración pública; las credenciales privilegiadas permanecen en el servidor.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las flechas indican el recorrido de una operación sensible. Las consultas públicas también acceden directamente a Supabase.</text><g id="card-1" data-card="80,345,480,390"><rect x="80" y="345" width="480" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="345" width="480" height="7" rx="3" fill="#166534"/><text x="108" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">CLIENTE</text><text x="108" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Bundle del navegador</text><path d="M108 461H532" stroke="#e4e8df"/><text x="108" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Variables VITE públicas</text><text x="108" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">SDK de Supabase</text><text x="108" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Nunca service_role</text><rect x="108" y="677" width="424" height="36" rx="11" fill="#edf5eb"/><text x="320" y="702" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Entorno no confiable</text></g><g id="card-2" data-card="720,345,480,390"><rect x="720" y="345" width="480" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="720" y="345" width="480" height="7" rx="3" fill="#2563eb"/><text x="748" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">SERVIDOR</text><text x="748" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Funciones Node</text><path d="M748 461H1172" stroke="#e4e8df"/><text x="748" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Variables privadas</text><text x="748" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Validación de entradas</text><text x="748" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Autorización por operación</text><rect x="748" y="677" width="424" height="36" rx="11" fill="#edf3fd"/><text x="960" y="702" font-size="19" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="0">Credenciales solo aquí</text></g><g id="card-3" data-card="1360,345,480,390"><rect x="1360" y="345" width="480" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1360" y="345" width="480" height="7" rx="3" fill="#166534"/><text x="1388" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">PROVEEDOR</text><text x="1388" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Supabase</text><path d="M1388 461H1812" stroke="#e4e8df"/><text x="1388" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Auth, datos y archivos</text><text x="1388" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">RLS para cliente público</text><text x="1388" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Integridad y cuotas SQL</text><rect x="1388" y="677" width="424" height="36" rx="11" fill="#edf5eb"/><text x="1600" y="702" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Persistencia gestionada</text></g><rect x="80" y="835" width="1760" height="100" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="871" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Dos caminos de acceso</text><text x="108" y="904" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El cliente consulta Supabase con RLS; las operaciones sensibles pasan por las API con permisos comprobados.</text></svg>