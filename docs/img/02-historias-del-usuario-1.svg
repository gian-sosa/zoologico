<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">02-historias-del-usuario-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M240 357 L240 428" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M600 357 L600 428" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M960 357 L960 428" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1320 357 L1320 428" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1680 357 L1680 428" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · HISTORIAS DE USUARIO</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Cinco objetivos que organizan el sistema</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las 15 historias describen necesidades del visitante, del consumidor y del personal.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">HU15: QR por especie → infografía directa. Requisito incorporado; cobertura y señalización pendientes.</text><rect x="80" y="265" width="1760" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="301" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Necesidades del usuario → funcionalidades verificables</text><text x="108" y="334" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">El alcance se conecta con criterios de aceptación y requisitos funcionales.</text><g id="card-1" data-card="80,440,320,370"><rect x="80" y="440" width="320" height="370" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="440" width="320" height="7" rx="3" fill="#166534"/><text x="108" y="483" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">HU01–HU04 · HU15</text><text x="108" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Informarse y</text><text x="108" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">aprender</text><path d="M108 592H372" stroke="#e4e8df"/><text x="108" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Horarios y tarifas</text><text x="108" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">QR e infografías</text><text x="108" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sonidos y</text><text x="108" y="726" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">cuestionarios</text></g><g id="card-2" data-card="440,440,320,370"><rect x="440" y="440" width="320" height="370" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="440" y="440" width="320" height="7" rx="3" fill="#166534"/><text x="468" y="483" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">HU05–HU06</text><text x="468" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Participar</text><path d="M468 556H732" stroke="#e4e8df"/><text x="468" y="591" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Enviar fotografías</text><text x="468" y="624" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Solicitar retirada</text><text x="468" y="657" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Esperar moderación</text></g><g id="card-3" data-card="800,440,320,370"><rect x="800" y="440" width="320" height="370" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="800" y="440" width="320" height="7" rx="3" fill="#2563eb"/><text x="828" y="483" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">HU07–HU09</text><text x="828" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Administrar</text><path d="M828 556H1092" stroke="#e4e8df"/><text x="828" y="591" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Acceso del personal</text><text x="828" y="624" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Modificar tarifas</text><text x="828" y="657" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Aprobar fotografías</text></g><g id="card-4" data-card="1160,440,320,370"><rect x="1160" y="440" width="320" height="370" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1160" y="440" width="320" height="7" rx="3" fill="#2563eb"/><text x="1188" y="483" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">HU10–HU11</text><text x="1188" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Presentar</text><text x="1188" y="564" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">documentos</text><path d="M1188 592H1452" stroke="#e4e8df"/><text x="1188" y="627" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Mesa de Partes</text><text x="1188" y="660" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">PDF opcional</text><text x="1188" y="693" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Revisión privada</text></g><g id="card-5" data-card="1520,440,320,370"><rect x="1520" y="440" width="320" height="370" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1520" y="440" width="320" height="7" rx="3" fill="#b45309"/><text x="1548" y="483" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">HU12–HU14</text><text x="1548" y="528" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Ejercer derechos</text><path d="M1548 556H1812" stroke="#e4e8df"/><text x="1548" y="591" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Registrar hoja</text><text x="1548" y="624" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Imprimir constancia</text><text x="1548" y="657" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Consultar bandeja</text></g><rect x="80" y="865" width="1760" height="92" rx="20" fill="#f1f3ee" stroke="#d6ddd3"/><text x="108" y="901" font-size="24" font-weight="600" fill="#536459" text-anchor="start" letter-spacing="0">Un sistema con permisos distintos</text><text x="108" y="934" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las historias no implican venta de entradas, CMS de especies ni respuestas administrativas automáticas.</text></svg>