<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">08-escenarios-atributos-calidad-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M382.4 535 L434.4 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M748.8 535 L800.8 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1115.1999999999998 535 L1167.1999999999998 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1481.6 535 L1533.6 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1692.8 735 L1692.8 788 L227.2 788 L227.2 735" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#amber)"/><rect x="712" y="760" width="496" height="37" rx="8" fill="#faf8f1"/><text x="960" y="783" font-size="21" font-weight="600" fill="#b45309" text-anchor="middle">Ajustar diseño o configuración y repetir</text><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ANÁLISIS · ESCENARIOS DE CALIDAD</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Medir antes de afirmar que se cumple</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cada evaluación identifica fuente, estímulo, entorno, respuesta y medida.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Las metas propuestas requieren aprobación y medición. No se presentan como resultados ya obtenidos.</text><g id="card-1" data-card="80,345,294.4,390"><rect x="80" y="345" width="294.4" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="345" width="294.4" height="7" rx="3" fill="#166534"/><text x="108" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">01 · PREPARAR</text><text x="108" y="433" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Definir</text><text x="108" y="469" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">escenario</text><path d="M108 497H346.4" stroke="#e4e8df"/><text x="108" y="532" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fuente y estímulo</text><text x="108" y="565" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Entorno controlado</text><text x="108" y="598" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Respuesta esperada</text></g><g id="card-2" data-card="446.4,345,294.4,390"><rect x="446.4" y="345" width="294.4" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="446.4" y="345" width="294.4" height="7" rx="3" fill="#166534"/><text x="474.4" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">02 · ACORDAR</text><text x="474.4" y="433" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Aprobar medida</text><path d="M474.4 461H712.8" stroke="#e4e8df"/><text x="474.4" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Métrica observable</text><text x="474.4" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Umbral y alcance</text><text x="474.4" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Condiciones de red</text></g><g id="card-3" data-card="812.8,345,294.4,390"><rect x="812.8" y="345" width="294.4" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="812.8" y="345" width="294.4" height="7" rx="3" fill="#2563eb"/><text x="840.8" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">03 · EJECUTAR</text><text x="840.8" y="433" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Probar el</text><text x="840.8" y="469" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">sistema</text><path d="M840.8 497H1079.1999999999998" stroke="#e4e8df"/><text x="840.8" y="532" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Datos sintéticos</text><text x="840.8" y="565" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Casos positivos</text><text x="840.8" y="598" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Casos negativos</text></g><g id="card-4" data-card="1179.1999999999998,345,294.4,390"><rect x="1179.1999999999998" y="345" width="294.4" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="1179.1999999999998" y="345" width="294.4" height="7" rx="3" fill="#2563eb"/><text x="1207.1999999999998" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">04 · CONSERVAR</text><text x="1207.1999999999998" y="433" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Registrar</text><text x="1207.1999999999998" y="469" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">evidencia</text><path d="M1207.1999999999998 497H1445.6" stroke="#e4e8df"/><text x="1207.1999999999998" y="532" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Resultados</text><text x="1207.1999999999998" y="565" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Condiciones</text><text x="1207.1999999999998" y="598" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Limitaciones</text></g><g id="card-5" data-card="1545.6,345,294.4,390"><rect x="1545.6" y="345" width="294.4" height="390" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1545.6" y="345" width="294.4" height="7" rx="3" fill="#b45309"/><text x="1573.6" y="388" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">05 · EVALUAR</text><text x="1573.6" y="433" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Comparar</text><text x="1573.6" y="469" font-size="28" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">objetivo</text><path d="M1573.6 497H1812" stroke="#e4e8df"/><text x="1573.6" y="532" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cumple: documentar</text><text x="1573.6" y="565" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">No cumple: ajustar</text><text x="1573.6" y="598" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Repetir la prueba</text></g><rect x="80" y="835" width="1760" height="100" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="871" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Ocho escenarios para verificar atributos de calidad</text><text x="108" y="904" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Rendimiento, resiliencia, carga, permisos, cambios, idempotencia, accesibilidad y fallos parciales.</text></svg>