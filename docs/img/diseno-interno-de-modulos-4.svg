<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">diseno-interno-de-modulos-4</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M474 535 L526 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M932 535 L984 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><path d="M1390 535 L1442 535" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · DISEÑO · IDEMPOTENCIA</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Reintentar sin duplicar una reclamación</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La clave de envío identifica el intento; el hash permite comprobar que los datos sean los mismos.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La idempotencia del alta no equivale a entrega garantizada del correo ni numeración sin saltos.</text><g id="card-1" data-card="80,345,386,390"><rect x="80" y="345" width="386" height="390" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="345" width="386" height="7" rx="3" fill="#166534"/><text x="108" y="388" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">ENTRADA</text><text x="108" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">POST de hoja</text><path d="M108 461H438" stroke="#e4e8df"/><text x="108" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">submission_key UUID</text><text x="108" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Datos del formulario</text><text x="108" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Conformidad</text></g><g id="card-2" data-card="538,345,386,390"><rect x="538" y="345" width="386" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="538" y="345" width="386" height="7" rx="3" fill="#2563eb"/><text x="566" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">REGLAS</text><text x="566" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Validar y normalizar</text><path d="M566 461H896" stroke="#e4e8df"/><text x="566" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">validateClaim</text><text x="566" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Campos permitidos</text><text x="566" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">SHA-256 del contenido</text></g><g id="card-3" data-card="996,345,386,390"><rect x="996" y="345" width="386" height="390" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="996" y="345" width="386" height="7" rx="3" fill="#2563eb"/><text x="1024" y="388" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">PERSISTENCIA</text><text x="1024" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Insertar o recuperar</text><path d="M1024 461H1354" stroke="#e4e8df"/><text x="1024" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">INSERT con clave única</text><text x="1024" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Duplicada: buscar hoja</text><text x="1024" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comparar payload_hash</text></g><g id="card-4" data-card="1454,345,386,390"><rect x="1454" y="345" width="386" height="390" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1454" y="345" width="386" height="7" rx="3" fill="#b45309"/><text x="1482" y="388" font-size="18" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1.5">RESULTADO</text><text x="1482" y="433" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Conservar evidencia</text><path d="M1482 461H1812" stroke="#e4e8df"/><text x="1482" y="496" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Hash igual: misma hoja</text><text x="1482" y="529" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Distinto: conflicto 409</text><text x="1482" y="562" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sin sobrescritura</text></g><rect x="80" y="835" width="1760" height="100" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="871" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Después de persistir: solicitar copia por correo</text><text x="108" y="904" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Si Resend falla, la hoja continúa registrada y la copia queda pendiente. No se crea otra hoja por ese fallo.</text></svg>