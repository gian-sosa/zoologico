<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">estilo-arquitectonico-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M305 385 L305 306 L528 306" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M1392 306 L1615 306 L1615 385" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><path d="M542 600 L722 600" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="572.8" y="527" width="118.4" height="66" rx="8" fill="#faf8f1"/><text x="632" y="550" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">HTTPS</text><text x="632" y="579" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">+ token*</text><path d="M1197 600 L1377 600" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="1198.3" y="527" width="177.4" height="66" rx="8" fill="#faf8f1"/><text x="1287" y="550" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">Operaciones</text><text x="1287" y="579" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">privilegiadas</text><path d="M305 850 L305 810" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M960 800 L960 840" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · ARQUITECTURA · ESTILO</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Cliente-servidor con servicios gestionados</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">SPA en el navegador + funciones Node en Vercel + Supabase como backend gestionado.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fotos y documentos requieren token. El registro de reclamaciones no exige sesión. Claves privadas: solo en servidor.</text><rect x="540" y="260" width="840" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="568" y="296" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Acceso directo del navegador a Supabase</text><text x="568" y="329" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Auth, consultas, tarifas y URL firmadas con permisos/RLS.</text><g id="card-1" data-card="80,395,450,405"><rect x="80" y="395" width="450" height="405" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="395" width="450" height="7" rx="3" fill="#166534"/><text x="108" y="438" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">CLIENTE</text><text x="108" y="483" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">React en el navegador</text><path d="M108 511H502" stroke="#e4e8df"/><text x="108" y="546" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fichas, mapa y cuestionarios</text><text x="108" y="579" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comunidad y formularios</text><text x="108" y="612" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Panel del personal</text><rect x="108" y="742" width="394" height="36" rx="11" fill="#edf5eb"/><text x="305" y="767" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">React + TypeScript</text></g><g id="card-2" data-card="735,395,450,405"><rect x="735" y="395" width="450" height="405" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="735" y="395" width="450" height="7" rx="3" fill="#2563eb"/><text x="763" y="438" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">SERVIDOR · VERCEL</text><text x="763" y="483" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">API Node / Serverless</text><path d="M763 511H1157" stroke="#e4e8df"/><text x="763" y="546" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">/api/photos · documents · claims</text><text x="763" y="579" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Verifica sesión y permisos</text><text x="763" y="612" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Valida y procesa archivos</text><rect x="763" y="742" width="394" height="36" rx="11" fill="#edf3fd"/><text x="960" y="767" font-size="19" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="0">Operaciones sensibles</text></g><g id="card-3" data-card="1390,395,450,405"><rect x="1390" y="395" width="450" height="405" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1390" y="395" width="450" height="7" rx="3" fill="#166534"/><text x="1418" y="438" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">SERVICIOS GESTIONADOS</text><text x="1418" y="483" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Supabase</text><path d="M1418 511H1812" stroke="#e4e8df"/><text x="1418" y="546" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Auth: sesiones y Google</text><text x="1418" y="579" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">PostgreSQL + Data API + RLS</text><text x="1418" y="612" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Storage: WebP y PDF privados</text><rect x="1418" y="742" width="394" height="36" rx="11" fill="#edf5eb"/><text x="1615" y="767" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Datos, identidad y archivos</text></g><rect x="80" y="850" width="450" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="108" y="886" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Vercel CDN</text><text x="108" y="919" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Entrega SPA y recursos estáticos.</text><rect x="735" y="850" width="450" height="92" rx="20" fill="#fff4e1" stroke="#ecd4ad"/><text x="763" y="886" font-size="24" font-weight="600" fill="#b45309" text-anchor="start" letter-spacing="0">Servicio de correo · Resend</text><text x="763" y="919" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Copia de hojas registradas.</text><rect x="1390" y="850" width="450" height="92" rx="20" fill="#edf5eb" stroke="#bed3c0"/><text x="1418" y="886" font-size="24" font-weight="600" fill="#166534" text-anchor="start" letter-spacing="0">Fotos con revisión</text><text x="1418" y="919" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Pendiente → aprobada → pública.</text></svg>