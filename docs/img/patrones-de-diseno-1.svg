<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title"><title id="title">patrones-de-diseno-1</title><defs><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#166534"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#536459"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b23c35"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif}</style></defs><rect width="1920" height="1080" fill="#faf8f1"/><rect width="1920" height="12" fill="#166534"/><path d="M522 525 L698 525" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"  marker-end="url(#blue)"/><rect x="544.9" y="484" width="130.2" height="37" rx="8" fill="#faf8f1"/><text x="610" y="507" font-size="21" font-weight="600" fill="#2563eb" text-anchor="middle">Solicitar</text><path d="M1210 435 L1310 435 L1310 400 L1398 400" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"  marker-end="url(#green)"/><path d="M1210 620 L1310 620 L1310 770 L1398 770" fill="none" stroke="#b45309" stroke-width="3" stroke-linejoin="round"  marker-end="url(#amber)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · DISEÑO · INSTANCIA COMPARTIDA</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Un cliente público, reutilizado por módulo</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">getSupabase() crea la instancia solo cuando existe configuración y hace falta utilizarla.</text><path d="M80 989H1840" stroke="#dce3d8"/><text x="80" y="1027" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La instancia pertenece al contexto del módulo en el navegador; no es una conexión global entre todos los usuarios.</text><g id="card-1" data-card="80,340,430,370"><rect x="80" y="340" width="430" height="370" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="80" y="340" width="430" height="7" rx="3" fill="#166534"/><text x="108" y="383" font-size="18" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1.5">CONSUMIDORES</text><text x="108" y="428" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Servicios y Auth</text><path d="M108 456H482" stroke="#e4e8df"/><text x="108" y="491" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Tarifas</text><text x="108" y="524" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Fotografías</text><text x="108" y="557" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Contexto de sesión</text><rect x="108" y="652" width="374" height="36" rx="11" fill="#edf5eb"/><text x="295" y="677" font-size="19" font-weight="600" fill="#166534" text-anchor="middle" letter-spacing="0">Mismo cliente público</text></g><g id="card-2" data-card="710,340,500,370"><rect x="710" y="340" width="500" height="370" rx="24" fill="white" stroke="#c3d3ee" stroke-width="2"/><rect x="710" y="340" width="500" height="7" rx="3" fill="#2563eb"/><text x="738" y="383" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start" letter-spacing="1.5">FUNCIÓN COMPARTIDA</text><text x="738" y="428" font-size="30" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">getSupabase()</text><path d="M738 456H1182" stroke="#e4e8df"/><text x="738" y="491" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">¿Existe una instancia?</text><text x="738" y="524" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Sí: devolverla</text><text x="738" y="557" font-size="23" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">No: comprobar configuración</text><rect x="738" y="652" width="444" height="36" rx="11" fill="#edf3fd"/><text x="960" y="677" font-size="19" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="0">Inicialización diferida</text></g><g id="card-3" data-card="1410,280,430,245"><rect x="1410" y="280" width="430" height="245" rx="24" fill="white" stroke="#bed3c0" stroke-width="2"/><rect x="1410" y="280" width="430" height="7" rx="3" fill="#166534"/><text x="1438" y="315" font-size="16" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="1">CONFIGURADO</text><text x="1438" y="356" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">createClient</text><path d="M1438 365H1812" stroke="#e4e8df"/><text x="1438" y="400" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Crear y conservar la instancia.</text></g><g id="card-4" data-card="1410,650,430,245"><rect x="1410" y="650" width="430" height="245" rx="24" fill="white" stroke="#ecd4ad" stroke-width="2"/><rect x="1410" y="650" width="430" height="7" rx="3" fill="#b45309"/><text x="1438" y="685" font-size="16" font-weight="700" fill="#b45309" text-anchor="start" letter-spacing="1">SIN CONFIGURACIÓN</text><text x="1438" y="726" font-size="26" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Devolver null</text><path d="M1438 735H1812" stroke="#e4e8df"/><text x="1438" y="770" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Cada consumidor informa o usa</text><text x="1438" y="799" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">fallback.</text></g><rect x="80" y="825" width="1130" height="92" rx="20" fill="#f1f3ee" stroke="#d6ddd3"/><text x="108" y="861" font-size="24" font-weight="600" fill="#536459" text-anchor="start" letter-spacing="0">La clave es pública; los permisos no</text><text x="108" y="894" font-size="21" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">La autorización efectiva sigue en RLS y en las comprobaciones de cada API.</text></svg>