66666666666" y="514" width="184.4" height="58" rx="7" fill="#faf8f1"/><text x="666.6666666666666" y="532" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">POST JSON +</text><text x="666.6666666666666" y="558" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">submission_key</text><circle cx="47" cy="664" r="17" fill="#edf3fd"/><text x="47" y="670" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">3</text><text x="893.3333333333333" y="657" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Comprobar configuración; validar datos y calcular</text><text x="893.3333333333333" y="683" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">hash</text><circle cx="47" cy="760" r="17" fill="#edf3fd"/><text x="47" y="766" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">4</text><rect x="838.7999999999998" y="706" width="242.4" height="58" rx="7" fill="#faf8f1"/><text x="959.9999999999999" y="724" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">INSERT con clave de</text><text x="959.9999999999999" y="750" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">envío única</text><circle cx="47" cy="856" r="17" fill="#edf5eb"/><text x="47" y="862" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">5</text><rect x="821.3999999999999" y="802" width="277.2" height="58" rx="7" fill="#faf8f1"/><text x="959.9999999999999" y="820" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Alta nueva o conflicto</text><text x="959.9999999999999" y="846" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">de unicidad</text><circle cx="47" cy="952" r="17" fill="#edf3fd"/><text x="47" y="958" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">6</text><rect x="815.5999999999999" y="898" width="288.8" height="58" rx="7" fill="#faf8f1"/><text x="959.9999999999999" y="916" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Si duplicada: recuperar</text><text x="959.9999999999999" y="942" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">por la misma clave</text><circle cx="47" cy="1048" r="17" fill="#edf5eb"/><text x="47" y="1054" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">7</text><rect x="856.1999999999999" y="994" width="207.6" height="58" rx="7" fill="#faf8f1"/><text x="959.9999999999999" y="1012" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Hoja existente y</text><text x="959.9999999999999" y="1038" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">payload_hash</text><circle cx="47" cy="1144" r="17" fill="#edf3fd"/><text x="47" y="1150" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">8</text><text x="893.3333333333333" y="1137" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Hash distinto: 409 y terminar; igual: continuar</text><circle cx="47" cy="1240" r="17" fill="#edf3fd"/><text x="47" y="1246" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">9</text><rect x="898.4666666666665" y="1212" width="416.4" height="32" rx="7" fill="#faf8f1"/><text x="1106.6666666666665" y="1230" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Solicitar copia cuando corresponde</text><circle cx="47" cy="1336" r="17" fill="#edf3fd"/><text x="47" y="1342" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">10</text><rect x="1408.0666666666666" y="1282" width="277.2" height="58" rx="7" fill="#faf8f1"/><text x="1546.6666666666665" y="1300" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">HTTP: correo con clave</text><text x="1546.6666666666665" y="1326" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">de idempotencia</text><circle cx="47" cy="1432" r="17" fill="#fff4e1"/><text x="47" y="1438" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0">11</text><rect x="1408.0666666666666" y="1378" width="277.2" height="58" rx="7" fill="#faf8f1"/><text x="1546.6666666666665" y="1396" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Aceptación o error del</text><text x="1546.6666666666665" y="1422" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">proveedor</text><circle cx="47" cy="1528" r="17" fill="#edf3fd"/><text x="47" y="1534" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">12</text><rect x="1114.7333333333333" y="1474" width="277.2" height="58" rx="7" fill="#faf8f1"/><text x="1253.3333333333333" y="1492" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Actualizar aceptación</text><text x="1253.3333333333333" y="1518" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">si el proveedor acepta</text><circle cx="47" cy="1624" r="17" fill="#fff4e1"/><text x="47" y="1630" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="0">13</text><rect x="892.6666666666665" y="1596" width="428" height="32" rx="7" fill="#faf8f1"/><text x="1106.6666666666665" y="1614" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">sent o pending: la hoja se conserva</text><circle cx="47" cy="1720" r="17" fill="#edf3fd"/><text x="47" y="1726" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">14</text><rect x="522.2666666666667" y="1666" width="288.8" height="58" rx="7" fill="#faf8f1"/><text x="666.6666666666666" y="1684" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">201: constancia nueva o</text><text x="666.6666666666666" y="1710" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">recuperada</text><circle cx="47" cy="1816" r="17" fill="#edf5eb"/><text x="47" y="1822" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">15</text><rect x="263.73333333333335" y="1762" width="219.2" height="58" rx="7" fill="#faf8f1"/><text x="373.3333333333333" y="1780" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">Hoja imprimible y</text><text x="373.3333333333333" y="1806" font-size="21" font-weight="500" fill="#1c241e" text-anchor="middle" letter-spacing="0">estado veraz</text><rect x="80" y="1880" width="1760" height="60" rx="20" fill="#fff4e1" stroke="#ecd4ad"/><text x="108" y="1918" font-size="24" font-weight="600" fill="#b45309" text-anchor="start" letter-spacing="0">Fallo de correo ≠ fallo de registro. La aceptación del proveedor no garantiza entrega ni lectura.</text></svg>