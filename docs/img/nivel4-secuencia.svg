harray="9 7" marker-end="url(#blue)"/><path d="M520 1824 L231.66666666666666 1824" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#green)"/><text x="80" y="77" font-size="20" font-weight="700" fill="#166534" text-anchor="start" letter-spacing="3">ZOOLÓGICO LA TOTORILLA · C4 · NIVEL 4 · SECUENCIA</text><text x="80" y="150" font-size="54" font-weight="700" fill="#1c241e" text-anchor="start" letter-spacing="0">Registrar, recuperar y conservar la hoja</text><text x="80" y="202" font-size="26" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Un reintento con la misma clave y los mismos datos recupera la constancia original.</text><path d="M80 1945H1840" stroke="#dce3d8"/><text x="80" y="1983" font-size="20" font-weight="400" fill="#536459" text-anchor="start" letter-spacing="0">Si no se indicó correo: not_requested. Si ya figura sent, el helper no vuelve a enviarla.</text><rect x="92" y="265" width="269.3333333333333" height="104" rx="18" fill="#edf5eb" stroke="#bed3c0"/><text x="226.66666666666666" y="298" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">PERSONA</text><text x="226.66666666666666" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">Consumidor</text><rect x="385.33333333333337" y="265" width="269.3333333333333" height="104" rx="18" fill="#edf5eb" stroke="#bed3c0"/><text x="520" y="298" font-size="17" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0">NAVEGADOR</text><text x="520" y="331" font-size="22" font-weight="600" fill="#1c241e" text-anchor="middle" letter-spacing="0">ClaimsPage</text><rect x="678.6666666666666" y="265" width="269.3333333333333" height="104" rx="18" fill="#edf3fd" stroke="#c3d3ee"/><text x="813.3333333333333" y="298" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0">SERVIDOR</text><text x="813.3333333333333" 